<!--
  Supabase dashboard → Authentication → Emails → Templates → "Confirm signup"
  Paste this into the "Message body" HTML editor. Keep the subject as-is or set:
  Subject: Confirm your email for PayNudge
-->
<body style="margin:0;padding:0;background-color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f8fafc;padding:40px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px;width:100%;background-color:#ffffff;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;">
          <tr>
            <td style="padding:32px 32px 0 32px;">
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="background-color:#3b52c4;width:28px;height:28px;border-radius:8px;text-align:center;vertical-align:middle;">
                    <span style="color:#ffffff;font-size:14px;font-weight:700;line-height:28px;">P</span>
                  </td>
                  <td style="padding-left:8px;font-size:16px;font-weight:700;color:#0f172a;">PayNudge</td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:28px 32px 8px 32px;">
              <h1 style="margin:0;font-size:20px;line-height:28px;font-weight:700;color:#0f172a;">
                Confirm your email
              </h1>
            </td>
          </tr>
          <tr>
            <td style="padding:0 32px 24px 32px;">
              <p style="margin:0;font-size:14px;line-height:22px;color:#475569;">
                Click the button below to confirm <strong>{{ .Email }}</strong> and finish setting up
                your PayNudge account.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:0 32px 32px 32px;">
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="background-color:#3b52c4;border-radius:8px;">
                    <a href="{{ .ConfirmationURL }}"
                       style="display:inline-block;padding:12px 24px;font-size:14px;font-weight:600;color:#ffffff;text-decoration:none;">
                      Confirm email address
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:0 32px 32px 32px;border-top:1px solid #f1f5f9;">
              <p style="margin:20px 0 0 0;font-size:12px;line-height:18px;color:#94a3b8;">
                If you didn't create a PayNudge account, you can safely ignore this email.
              </p>
            </td>
          </tr>
        </table>
        <p style="margin:20px 0 0 0;font-size:12px;color:#94a3b8;">
          © PayNudge
        </p>
      </td>
    </tr>
  </table>
</body>
